<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Gran Juicio de la IA · Votación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16130f; --paper:#f3ecdf; --paper2:#e8dcc6; --wood:#5a3a22; --wood2:#3b2515;
  --gold:#b8862f; --red:#a3342a; --green:#2f8a4a; --amber:#c98a1b; --mute:#6f6253;
  --line:rgba(22,19,15,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(circle at 20% 0%,rgba(184,134,47,.10),transparent 50%),radial-gradient(circle at 100% 100%,rgba(90,58,34,.10),transparent 45%);
  min-height:100vh;line-height:1.45}
header.top{background:linear-gradient(180deg,var(--wood),var(--wood2));color:#f6eedd;padding:22px 20px 18px;border-bottom:4px solid var(--gold)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.seal{width:54px;height:54px;flex:none}
.top h1{font-family:'Spectral',serif;font-weight:700;font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.3px}
.top p{margin:2px 0 0;opacity:.82;font-size:14px}
.top .who{margin-left:auto;font-size:14px;text-align:right}
.top .who b{display:block;font-size:16px}
nav.tabs{display:flex;gap:6px;margin:18px 0 6px}
nav.tabs button{font:inherit;border:1px solid var(--line);background:#fffaf0;padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:10px 0 60px}
h2{font-family:'Spectral',serif;font-size:26px;margin:18px 0 6px}
.lead{color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.case{position:relative;background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -14px rgba(59,37,21,.45);transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:inherit}
.case:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(59,37,21,.6)}
.case .num{font-family:'Spectral',serif;font-size:13px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.case h3{font-family:'Spectral',serif;font-size:21px;margin:4px 0 10px;line-height:1.15}
.faces{display:flex;margin:0 0 12px}
.faces img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fffaf0;margin-left:-8px;background:var(--paper2)}
.faces img:first-child{margin-left:0}
.case .st{font-size:14px;color:var(--mute)}
.case .st b{color:var(--ink)}
.case.done{border-color:rgba(47,138,74,.45)}
.case.locked{cursor:not-allowed;background:repeating-linear-gradient(135deg,#efe6d6 0 10px,#e9dfcc 10px 20px)}
.case.locked:hover{transform:none}
.case.locked .faces img{filter:grayscale(1) opacity(.5)}
.lockbadge{position:absolute;inset:auto 12px 12px auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;
  font-weight:700;letter-spacing:1.5px;font-size:12px;padding:6px 10px;border-radius:8px}
.lockbadge svg{width:15px;height:15px}
.bigl{position:absolute;top:14px;right:14px;width:34px;height:34px;color:var(--wood)}
.total{margin:22px 0 0;background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.light{width:22px;height:22px;border-radius:50%;flex:none;background:#c9c0b2;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25)}
.light.g{background:#38c25f;box-shadow:0 0 0 4px rgba(56,194,95,.18),0 0 16px 2px rgba(56,194,95,.7),inset 0 -3px 6px rgba(0,0,0,.2)}
.light.r{background:#d9463a;box-shadow:0 0 0 4px rgba(217,70,58,.15),inset 0 -3px 6px rgba(0,0,0,.25)}
.light.a{background:#e0a12a;box-shadow:0 0 0 4px rgba(224,161,42,.15),inset 0 -3px 6px rgba(0,0,0,.25)}
.scale{display:flex;gap:3px;flex:1;min-width:220px}
.scale i{flex:1;height:26px;border-radius:4px;background:#e4d9c6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--mute);font-weight:700}
.scale i.f{background:var(--wood);color:#fff}
.scale i.f.p{background:var(--green)}
.scale i.mark{outline:2px dashed var(--green);outline-offset:1px}
.tag{font-weight:700;letter-spacing:1px;font-size:14px;padding:5px 10px;border-radius:8px;white-space:nowrap}
.tag.g{background:rgba(47,138,74,.14);color:var(--green)}
.tag.r{background:rgba(163,52,42,.12);color:var(--red)}
.tag.a{background:rgba(201,138,27,.14);color:#94650f}
/* voting */
.back{font:inherit;background:none;border:none;color:var(--wood);cursor:pointer;padding:6px 0;font-weight:700}
.people{display:grid;gap:12px;margin-top:10px}
.p{display:grid;grid-template-columns:96px 1fr;gap:14px;background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:12px}
.p img{width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--paper2)}
.p h4{margin:0;font-family:'Spectral',serif;font-size:19px}
.p .role{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.p .d{margin:6px 0 10px;font-size:15px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;user-select:none;background:#fff}
.ch input{width:20px;height:20px;accent-color:var(--wood);margin:0}
.ch label.y:has(input:checked){border-color:var(--red);background:rgba(163,52,42,.07);color:var(--red)}
.ch label.n:has(input:checked){border-color:var(--green);background:rgba(47,138,74,.07);color:var(--green)}
.p.miss{outline:2px solid var(--amber)}
.p.pick{outline:3px solid var(--red);background:#fff4ef}
.bar{position:sticky;bottom:0;margin-top:18px;background:rgba(243,236,223,.94);backdrop-filter:blur(6px);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;background:var(--wood);color:#fff;border:none;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--wood);border:2px solid var(--wood)}
.btn.sm{padding:6px 10px;font-size:13px}
.note{font-size:14px;color:var(--mute)}
.result{background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;margin-top:14px}
.result .pts{font-family:'Spectral',serif;font-size:64px;line-height:1;margin:8px 0}
.mylist{list-style:none;padding:0;margin:14px auto 0;max-width:420px;text-align:left}
.mylist li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mylist img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.mylist span{margin-left:auto;font-weight:700}
/* forms / dialog */
.card{background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:24px;max-width:520px;margin:24px auto}
.card input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;margin:8px 0 14px;background:#fff}
.dlg{position:fixed;inset:0;background:rgba(22,19,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.dlg .card{margin:0}
.err{background:rgba(163,52,42,.1);color:var(--red);border-radius:10px;padding:12px;margin:12px 0}
/* admin */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.stat{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:'Spectral',serif;font-size:28px}
table{width:100%;border-collapse:collapse;background:#fffaf0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--paper2);font-size:13px;letter-spacing:.5px;text-transform:uppercase}
td.n{text-align:center;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--green);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#38c25f;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.hidden{display:none!important}
@media (max-width:560px){.p{grid-template-columns:72px 1fr}.p img{width:72px;height:72px}.top .who{margin-left:0;text-align:left}}
</style>
</head>

function totalOf(doc){ let t=0,n=0; for(const s of ['h1','h2','h3']){ const v=doc?.h?.[s]; if(v){t+=Number(v.pts)||0;n++;} } return {t,n}; }
function status(t,n){ if(t>=PASS) return 'g'; if(n>=3) return 'r'; return 'a'; }
function statusText(s){ return s==='g'?'APROBADO':s==='r'?'DESAPROBADO':'EN CURSO'; }
function scaleHTML(t){ let h='<div class="scale" aria-label="Escala del 1 al 10">'; for(let i=1;i<=10;i++){ h+=`<i class="${t>=i?'f':''} ${t>=PASS&&t>=i?'p':''} ${i===PASS?'mark':''}">${i}</i>`;} return h+'</div>'; }
function dialog(html){ $('#dlg').innerHTML = `<div class="dlg"><div class="card">${html}</div></div>`; }
function closeDialog(){ $('#dlg').innerHTML=''; }

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  view=b.dataset.t; render();
});

function setWho(){
  $('#who').innerHTML = me?.nombre ? `<span>Alumno/a</span><b>${esc(me.nombre)}</b><button class="back" id="salir" style="color:#e9d6b0;font-size:13px;padding:2px 0">No soy yo · cambiar</button>` : '';
  const s=$('#salir'); if(s) s.onclick=()=>{ store.set('gj_nombre',null); me=null; render(); };
}

async function boot(){
  $('#tabs').classList.remove('hidden');
  if(!API || API.startsWith('__')){ app.innerHTML='<div class="card"><h2>Falta conectar la planilla</h2><p>Este programa todavía no tiene el enlace de la planilla de votos.</p></div>'; return; }
  const saved = store.get('gj_nombre');
  if(saved){ await loadMe(saved); }
  render();
}
async function loadMe(nombre){
  app.innerHTML='<div class="card"><p>Buscando tu legajo…</p></div>';
  try{
    const r = await apiGet({action:'estado', nombre});
    if(r.ok){ me = {nombre: r.nombre || nombre, h: r.h || {}}; store.set('gj_nombre', me.nombre); return true; }
  }catch(e){}
  me=null; return false;
}

function render(){
  setWho();
  if(view==='admin') return renderAdmin();
  stopAdmin();
  if(!me?.nombre) return renderName();
  renderHome();
}

function renderName(){
  app.innerHTML = `<div class="card"><h2>Antes de entrar a la sala</h2>
   <p class="lead">Escribí tu apellido y nombre tal como figuran en la lista del curso. Usá siempre el mismo: con ese nombre te ve el profesor.</p>
   <form id="f"><input type="text" id="nm" maxlength="80" placeholder="Apellido y nombre" autocomplete="name" required>
   <button class="btn" type="submit">Entrar</button></form><div id="e"></div></div>`;
  $('#f').onsubmit = async ev=>{
    ev.preventDefault();
    const nombre = $('#nm').value.trim().replace(/\s+/g,' ');
    if(nombre.length<5 || !nombre.includes(' ')){ $('#e').innerHTML='<div class="err">Escribí tu apellido y tu nombre completos.</div>'; return; }
    const ok = await loadMe(nombre);
    if(!ok){ renderName(); $('#e').innerHTML='<div class="err">No me pude conectar con la planilla. Revisá internet y probá de nuevo.</div>'; return; }
    render();
  };
}

function renderHome(){
  const {t,n}=totalOf(me); const s=status(t,n);
  let h = `<h2>Elegí una historia</h2><p class="lead">Mirá el video, entrá al caso y elegí a un solo responsable. Cada historia se vota una sola vez.</p><div class="grid">`;
  for(const st of STORIES){
    const v = me?.h?.[st.id];
    const faces = st.people.map(p=>`<img src="${img(p.k)}" alt="">`).join('');
    if(st.locked){
      h += `<div class="case locked" aria-disabled="true"><svg class="bigl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2" fill="currentColor"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <div class="num">${st.n}</div><h3>${st.title}</h3><div class="faces">${faces}</div>
        <div class="st">No se puede votar todavía.</div><div class="lockbadge">${lock}RECUPERATORIO</div></div>`;
    } else {
      h += `<button class="case ${v?'done':''}" data-s="${st.id}"><div class="num">${st.n}</div><h3>${st.title}</h3><div class="faces">${faces}</div>
        <div class="st">${v?`Votada · <b>${v.pts} punto${v.pts===1?'':'s'}</b>`:`${st.people.length} protagonistas · <b>Votar</b>`}</div></button>`;
    }
  }
  h += `</div><div class="total"><div class="light ${s==='g'?'g':s==='r'?'r':''}"></div>
     <div><div class="note">Tu total (${n} de 3 historias)</div><div style="font-family:Spectral,serif;font-size:30px;font-weight:700">${t} punto${t===1?'':'s'}</div></div>
     ${scaleHTML(t)}<span class="tag ${s}">${statusText(s)}</span></div>
     <p class="note">Se aprueba con 7 puntos en total. Si pasás de 10, mejor todavía: ya aprobaste.</p>`;
  app.innerHTML = h;
  app.querySelectorAll('button.case').forEach(b=>b.onclick=()=>openStory(b.dataset.s));
}

function openStory(sid){
  const st = STORIES.find(x=>x.id===sid);
  const v = me?.h?.[sid];
  if(v) return showResult(st, v);
  let h = `<button class="back" id="bk">← Volver a las historias</button>
   <h2>${st.n} · ${st.title}</h2><p class="lead">Elegí <b>un solo responsable</b>. Sumás puntos según su grado de responsabilidad: el responsable mayor da más puntos. Si elegís a alguien que no es responsable, no sumás.</p><div class="people">`;
  for(const p of st.people){
    h += `<div class="p" id="p-${p.k}"><img src="${img(p.k)}" alt="Retrato de ${esc(p.name)}"><div>
      <div class="role">${esc(p.role)}</div><h4>${esc(p.name)}</h4><p class="d">${esc(p.d)}</p>
      <div class="ch"><label class="y"><input type="radio" name="resp" value="${p.k}">Es el responsable</label></div></div></div>`;
  }
  h += `</div><div class="bar"><button class="btn" id="send">Enviar mi voto</button><span class="note" id="cnt"></span></div>`;
  app.innerHTML = h; scrollTo(0,0);
  $('#bk').onclick=()=>render();
  const count=()=>{ const c=app.querySelector('input[name="resp"]:checked'); const p=c&&st.people.find(x=>x.k===c.value); $('#cnt').textContent= p?`Elegiste a ${p.name}`:'Todavía no elegiste a nadie'; app.querySelectorAll('.p').forEach(el=>el.classList.toggle('pick', !!c && el.id==='p-'+c.value)); };
  app.querySelectorAll('input[type=radio]').forEach(i=>i.onchange=()=>{ app.querySelectorAll('.p').forEach(el=>el.classList.remove('miss')); count(); });
  count();
  $('#send').onclick=()=>{
    const c=app.querySelector('input[name="resp"]:checked');
    if(!c){ app.querySelectorAll('.p').forEach(el=>el.classList.add('miss')); $('#cnt').textContent='Elegí a un responsable antes de enviar.'; return; }
    const marks={}; for(const p of st.people) marks[p.k] = p.k===c.value ? 'si' : 'no';
    const chosen = st.people.find(p=>p.k===c.value);
    dialog(`<h2>¿Confirmás tu veredicto?</h2><p>Elegiste como responsable a: <b>${esc(chosen.name)}</b>.</p><p class="note">Después de enviarlo no se puede cambiar.</p>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="ok">Sí, enviar</button><button class="btn ghost" id="no">Revisar</button></div><div id="e"></div>`);
    $('#no').onclick=closeDialog;
    $('#ok').onclick=async ()=>{
      $('#ok').disabled=true; $('#ok').textContent='Enviando…';
      try{
        const r = await apiPost({action:'votar', nombre: me.nombre, historia: sid, marks});
        if(r.ok || r.error==='repetido'){
          me.h = r.h || me.h; closeDialog();
          showResult(st, me.h[sid], r.ok);
          if(r.error==='repetido') dialog('<h2>Esta historia ya estaba votada</h2><p>Quedó guardado tu primer voto.</p><button class="btn" onclick="closeDialog()">Entendido</button>');
          return;
        }
        throw new Error(r.error||'error');
      }catch(e){ $('#ok').disabled=false; $('#ok').textContent='Sí, enviar'; $('#e').innerHTML=`<div class="err">No se pudo guardar el voto. Revisá internet y probá de nuevo.</div>`; }
    };
  };
}

function showResult(st, v, fresh){
  const {t,n}=totalOf(me); const s=status(t,n);
  const list = st.people.map(p=>`<li><img src="${img(p.k)}" alt="">${esc(p.name)}<span>${v.marks?.[p.k]==='si'?'Tu elegido':''}</span></li>`).join('');
  app.innerHTML = `<button class="back" id="bk">← Volver a las historias</button>
   <div class="result"><div class="num" style="color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:13px">${st.n} · ${st.title}</div>
   <p>${fresh?'¡Voto registrado! En esta historia sumaste':'En esta historia sumaste'}</p>
   <div class="pts">${v.pts}</div><p>punto${v.pts===1?'':'s'}</p>
   <ul class="mylist">${list}</ul>
   <div class="total" style="justify-content:center"><div class="light ${s==='g'?'g':s==='r'?'r':''}"></div><div><b>Total: ${t} punto${t===1?'':'s'}</b></div>${scaleHTML(t)}<span class="tag ${s}">${statusText(s)}</span></div>
   </div>`;
  $('#bk').onclick=()=>render(); scrollTo(0,0);
}

/* ---------- Administración (con contraseña) ---------- */
function stopAdmin(){ if(adminTimer){ clearInterval(adminTimer); adminTimer=null; } }
function renderAdmin(){
  if(!adminPass){
    app.innerHTML = `<div class="card"><h2>Zona del profesor</h2><p class="lead">Ingresá la contraseña de administración.</p>
      <form id="af"><input type="password" id="pw" style="width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;margin:8px 0 14px" autocomplete="current-password" required>
      <button class="btn" type="submit">Entrar</button></form><div id="e"></div></div>`;
    $('#af').onsubmit = async ev=>{
      ev.preventDefault(); const pw=$('#pw').value; ev.submitter.disabled=true;
      try{ const r=await apiGet({action:'admin', pass:pw});
        if(r.ok){ adminPass=pw; adminRows=r.alumnos||[]; renderAdmin(); }
        else { ev.submitter.disabled=false; $('#e').innerHTML='<div class="err">Contraseña incorrecta.</div>'; }
      }catch(e){ ev.submitter.disabled=false; $('#e').innerHTML='<div class="err">No me pude conectar con la planilla.</div>'; }
    };
    return;
  }
  app.innerHTML = `<h2>Administración <span class="live">en vivo</span></h2><p class="lead">Se actualiza sola cada 5 segundos. Se aprueba con ${PASS} puntos.</p>
    <div class="stats" id="stats"></div><div class="tablewrap"><table><thead><tr><th></th><th>Alumno/a</th><th class="n">H1</th><th class="n">H2</th><th class="n">H3</th><th class="n">Total</th><th>Estado</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn ghost sm" id="csv">Copiar planilla</button><button class="btn ghost sm" id="out">Cerrar sesión</button><span class="note" id="cp"></span></div>
    <p class="note" style="margin-top:16px">Un solo responsable por historia: se suma el grado del elegido (máximo 4 por historia, 12 en total). Elegir a un no responsable da 0. «Reabrir» borra los votos del alumno para que vuelva a votar todo. Todos los votos quedan también en la planilla de Google.</p>`;
  drawAdmin();
  stopAdmin();
  adminTimer = setInterval(pollAdmin, 5000);
  $('#out').onclick=()=>{ adminPass=''; stopAdmin(); renderAdmin(); };
  $('#csv').onclick=async ()=>{
    const rows=[['Alumno','H1','H2','H3','Total','Estado']].concat(sorted().map(r=>{const {t,n}=totalOf(r);return [r.nombre, r.h?.h1?.pts??'', r.h?.h2?.pts??'', r.h?.h3?.pts??'', t, statusText(status(t,n))];}));
    try{ await navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n')); $('#cp').textContent='Copiada. Pegala en una planilla.'; }catch(e){ $('#cp').textContent='El navegador no dejó copiar.'; }
  };
}
async function pollAdmin(){
  try{ const r=await apiGet({action:'admin', pass:adminPass}); if(r.ok){ adminRows=r.alumnos||[]; adminErr=''; } else adminErr='Se perdió el acceso.'; }
  catch(e){ adminErr='Sin conexión: los datos pueden estar desactualizados.'; }
  if(view==='admin') drawAdmin();
}
function sorted(){ return adminRows.filter(r=>r.nombre).slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es')); }
function drawAdmin(){
  const tb=$('#tb'); if(!tb) return;
  const rows=sorted(); let ap=0,de=0,cu=0;
  if(!rows.length) tb.innerHTML='<tr><td colspan="8">Nadie votó todavía.</td></tr>';
  else tb.innerHTML = rows.map(r=>{
    const {t,n}=totalOf(r); const s=status(t,n); if(s==='g')ap++; else if(s==='r')de++; else cu++;
    const c = id => r.h?.[id] ? r.h[id].pts : '–';
    return `<tr><td><div class="light ${s==='g'?'g':s==='r'?'r':'a'}"></div></td><td>${esc(r.nombre)}</td><td class="n">${c('h1')}</td><td class="n">${c('h2')}</td><td class="n">${c('h3')}</td><td class="n"><b>${t}</b></td><td><span class="tag ${s}">${statusText(s)}</span></td><td><button class="btn ghost sm" data-del="${esc(r.clave)}">Reabrir</button></td></tr>`;
  }).join('');
  $('#stats').innerHTML = `<div class="stat">Votaron<b>${rows.length}</b></div><div class="stat" style="color:var(--green)">Aprobados<b>${ap}</b></div><div class="stat" style="color:var(--red)">Desaprobados<b>${de}</b></div><div class="stat" style="color:#94650f">En curso<b>${cu}</b></div>` + (adminErr?`<span class="note" style="align-self:center">${esc(adminErr)}</span>`:'');
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const r=adminRows.find(x=>x.clave===b.dataset.del);
    dialog(`<h2>¿Reabrir a ${esc(r?.nombre)}?</h2><p>Se borran todos sus votos y puede volver a votar.</p><div style="display:flex;gap:10px"><button class="btn" id="ok">Reabrir</button><button class="btn ghost" id="no">Cancelar</button></div><div id="e"></div>`);
    $('#no').onclick=closeDialog;
    $('#ok').onclick=async()=>{ $('#ok').disabled=true; try{ const x=await apiPost({action:'reabrir', pass:adminPass, clave:b.dataset.del}); if(!x.ok) throw 0; closeDialog(); pollAdmin(); }catch(e){ $('#ok').disabled=false; $('#e').innerHTML='<div class="err">No se pudo.</div>'; } };
  });
}

boot();
</script>
</body>
</html>
